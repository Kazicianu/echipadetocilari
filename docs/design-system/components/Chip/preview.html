<!doctype html>
<html lang="ro">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip</title>
<style>
  html, body { margin: 0; }
  body { padding: 24px; background: var(--white); color: var(--ink); font-family: var(--font-sans); }
  .panel { margin: 22px 0; padding: 18px; border-radius: var(--radius-card); background: var(--orange); }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
</style>
</head>
<body>
<ul class="ect-chips">
  <li class="ect-chip">Consultație de 30 de minute, gratuită</li>
  <li class="ect-chip">Îți spunem și ce nu merită</li>
  <li class="ect-chip">Un singur om de contact</li>
  <li class="ect-chip">Termen scris în ofertă</li>
</ul>
<div class="panel">
  <ul class="ect-chips"><li class="ect-chip ect-chip--flat">Descrieri</li><li class="ect-chip ect-chip--flat">Prețuri</li><li class="ect-chip ect-chip--flat">Stocuri</li><li class="ect-chip ect-chip--flat">Imagini</li></ul>
</div>
<div class="tags">
  <span class="ect-tag ect-tag--solid">Campanie: service centrale</span>
  <span class="ect-tag">Grup: revizie</span>
  <span class="ect-tag ect-tag--dot">Activitate</span>
  <span class="ect-tag ect-tag--tint">către Google</span>
  <span class="ect-tag ect-tag--small">către noi</span>
</div>
</body>
</html>
