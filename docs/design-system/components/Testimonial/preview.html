<!doctype html>
<html lang="ro">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testimonial</title>
<style>
  html, body { margin: 0; }
  body { padding: 24px; background: var(--white); color: var(--ink); font-family: var(--font-sans); }
  body { padding: 40px 30px; }
  blockquote { margin: 0; }
</style>
</head>
<body>
<div class="ect-testimonials">
  <div class="ect-testimonials__head">
    <h3 class="ect-testimonials__eyebrow">Testimoniale</h3>
    <h2 class="ect-testimonials__title">Ce spun clienții despre noi</h2>
  </div>
  <figure class="ect-testimonial">
    <blockquote class="ect-testimonial__text">“Am lucrat cu această agenție de marketing online și am fost impresionată de nivelul lor de expertiză. Echipa lor a fost mereu disponibilă și a răspuns prompt la întrebările noastre. Ne-au ajutat să ne îmbunătățim strategia de marketing și să creștem vizibilitatea online a afacerii noastre. Recomand cu încredere această agenție.”</blockquote>
    <figcaption class="ect-testimonial__cite"><span class="ect-testimonial__name">Maria Andone</span><span class="ect-testimonial__company">Restaurant Conacu</span></figcaption>
    <div class="ect-testimonial__dots" aria-hidden="true"><span></span><span aria-current="true"></span><span></span></div>
  </figure>
</div>
</body>
